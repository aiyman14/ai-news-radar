name: probe

# Manual diagnostic: which source hosts are reachable from a GitHub runner,
# and with which User-Agent. Prints one status line per target; nothing else.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Feed URLs to probe (space/comma separated); empty = built-in targets"
        required: false
        default: ""
      ua:
        description: "User-Agent: radar | browser"
        required: false
        default: "radar"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe sources
        run: pnpm --filter @radar/ingest exec tsx src/probe.ts
        env:
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_UA: ${{ inputs.ua }}
