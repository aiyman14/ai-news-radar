name: radar

# The whole product in one job: fetch every source, run the pipeline in
# memory, build the static site from the result, publish it to GitHub Pages.
# Runs once a day; also on demand and whenever main changes (so a code push
# redeploys with fresh data). Nothing is written back to main.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily (keep in sync with REFRESH_HOUR_UTC in RefreshTimer.tsx)
  workflow_dispatch:
  push:
    branches: [main]

# contents:write is needed to push the gh-pages branch (the deploy target).
# That daily push is also what keeps this schedule alive: GitHub disables
# cron workflows on public repos after 60 days without repository activity.
permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # GitHub Pages project site → https://<owner>.github.io/<repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest all sources (in memory → data/radar.json)
        run: pnpm --filter @radar/ingest start
        env:
          # The default token lifts the GitHub releases adapter to 1k req/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site
        run: pnpm --filter @radar/web build

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          force_orphan: true # the branch holds only the latest build — no history to grow
          commit_message: "radar: daily build"
