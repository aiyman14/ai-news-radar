name: ingest

on:
  schedule:
    # Every 12 hours (00:00 + 12:00 UTC). GH cron can drift up to ~15 min.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source slugs to limit the run to (optional)"
        required: false
        default: ""

# Least-privilege: the job only reads the repo; all writes go to Supabase.
permissions:
  contents: read

# A long run must never be clobbered by the next cron tick.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion
        run: pnpm --filter @radar/ingest start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: raises the GitHub releases adapter's rate limit.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASES_PAT }}
          # Optional bring-your-own-key LLM enrichment (unset → stages skip).
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDINGS_PROVIDER: ${{ secrets.EMBEDDINGS_PROVIDER }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          INGEST_LIMIT_SOURCES: ${{ inputs.sources }}
