# Local Supabase (Docker) config. `supabase start` boots the stack;
# `supabase db reset` applies migrations/ then seed/.
project_id = "ai-news-radar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[auth]
# The dashboard is public-read (anon key only) — no auth service needed.
enabled = false
